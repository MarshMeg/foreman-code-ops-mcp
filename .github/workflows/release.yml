name: release

# tree-sitter needs cgo, so each platform is built natively on its own runner
# instead of cross-compiling. Linux builds on 22.04 for an older glibc baseline.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-22.04-arm, goos: linux, goarch: arm64 }
          # macOS is best effort in v1: a failed build does not block the release.
          - { runner: macos-15, goos: darwin, goarch: arm64, best_effort: true }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64, best_effort: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.best_effort == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          name="foreman-code-ops_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          test "$(go env GOOS)/$(go env GOARCH)" = "${{ matrix.goos }}/${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/$name/foreman-code-ops" ./cmd/foreman-code-ops
          "dist/$name/foreman-code-ops" version
          cp LICENSE README.md README.ru.md config.example.yaml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
