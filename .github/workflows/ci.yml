name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is best effort in v1.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Language toolchains for the adapter gate tests (each test is skipped when its tools are missing).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install ruff pyright mypy pytest
      - run: npm install -g typescript prettier @biomejs/biome eslint vitest
      # Rust (cargo, rustfmt) is preinstalled on GitHub runners; make sure rustfmt is there.
      - run: rustup component add rustfmt
      # Language servers for the LSP tests (pyright-langserver comes with pyright, tsc --lsp with TypeScript 7).
      - run: go install golang.org/x/tools/gopls@v0.20.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: go vet ./...
      - run: go test -race ./...
      # The sidecar's unit tests use a fake query function; no SDK install or API key needed.
      - run: node --test 'sidecar/agent-sdk/*.test.mjs'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The marketplace (repository root) and the plugin manifest.
      - run: npx -y @anthropic-ai/claude-code@2.1.294 plugin validate .
      - run: npx -y @anthropic-ai/claude-code@2.1.294 plugin validate ./plugin

  build:
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0-dev.${{ github.sha }}
