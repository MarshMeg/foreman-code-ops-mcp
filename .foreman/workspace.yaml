# Services of this project. Each file belongs to the service with the most specific root;
# the gate, formatters and tests run in that root. Generated by `foreman-code-ops init`.
services:
  - name: foreman-code-ops
    root: .
    lang: go
  # Claude Agent SDK sidecar; the Go server starts it as a subprocess and talks JSON lines
  # over stdio (internal/providers/agentsdk.go), so there is no HTTP link to declare.
  - name: agent-sdk
    root: sidecar/agent-sdk
    lang: javascript
