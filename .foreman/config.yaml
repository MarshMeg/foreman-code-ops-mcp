# Project settings for foreman-code-ops; see docs/config.md.
# API keys never go here. The validator runs through the Claude Agent SDK sidecar and uses the
# Claude Code login (claude.ai subscription); a set ANTHROPIC_API_KEY would take precedence.

generator:
  provider: openai
  base_url: http://localhost:8080/v1
  model: qwythos.9b.q4_k_m.mtp.gguf
  slots: 4                # llama-server -np 4
  slot_ctx: 53248         # llama-server -c 212992 / -np 4

validator:
  provider: agent-sdk
  model: claude-sonnet-5-5

agent_sdk:
  command: foreman-agent-sdk   # pnpm add -g the sidecar package, see sidecar/agent-sdk
