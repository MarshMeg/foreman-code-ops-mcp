# Project settings for foreman-code-ops; see docs/config.md.
# API keys never go here: the validator reads ANTHROPIC_API_KEY from the environment.

generator:
  provider: openai
  base_url: http://localhost:8080/v1
  model: qwythos.9b.q4_k_m.mtp.gguf
  slots: 4                # llama-server -np 4
  slot_ctx: 53248         # llama-server -c 212992 / -np 4

validator:
  provider: anthropic
  model: claude-sonnet-5-5
